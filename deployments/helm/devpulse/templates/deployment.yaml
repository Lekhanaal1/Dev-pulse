apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devpulse.fullname" . }}-user-service
  labels:
    {{- include "devpulse.labels" . | nindent 4 }}
    app: user-service
spec:
  replicas: {{ .Values.replicaCount.userService }}
  selector:
    matchLabels:
      {{- include "devpulse.selectorLabels" . | nindent 6 }}
      app: user-service
  template:
    metadata:
      labels:
        {{- include "devpulse.selectorLabels" . | nindent 8 }}
        app: user-service
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.image.repository }}/user-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ .Values.env.userService.DB_HOST }}
            - name: DB_USER
              value: {{ .Values.env.userService.DB_USER }}
            - name: DB_PASSWORD
              value: {{ .Values.env.userService.DB_PASSWORD }}
            - name: DB_NAME
              value: {{ .Values.env.userService.DB_NAME }}
          resources:
            {{- toYaml .Values.resources.userService | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
